[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "igallery"
version = "0.1.0"
description = "Offline Immich slideshow for Raspberry Pi"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "Pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "build>=1,<2"]

[tool.setuptools.packages.find]
include = ["igallery*"]

[tool.setuptools.package-data]
igallery = ["web/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
